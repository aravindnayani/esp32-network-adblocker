[platformio]
default_envs = c3

[env]
# Everything pinned to exact versions so a build today matches a build next year, and CI
# can't silently pick up a new framework (the app slot has ~75 KB headroom) or a
# compromised release. The platform pins its toolchains exactly but leaves these three as
# ~ ranges, hence platform_packages. To upgrade: bump the platform, then copy the resolved
# versions from `pio pkg list -e c3`.
platform = platformio/espressif32 @ 7.1.3
platform_packages =
    platformio/framework-arduinoespressif32 @ 4.20017.260907+sha.dcc1105b
    platformio/tool-esptoolpy @ 2.41100.260830
    platformio/tool-mklittlefs @ 1.203.210628
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
