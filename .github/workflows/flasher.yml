name: flasher

# Builds the browser-flasher images (docs/index.html + manifest.json) from the current
# source and deploys them to GitHub Pages. The .bin files used to be committed by hand
# and went stale: the published firmware predated the dashboard auth entirely.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "platformio.ini"
      - "partitions.csv"
      - "partitions-s3-8mb.csv"
      - "docs/**"
      - "tools/build_blocklist.py"
      - "tools/requirements-ci.txt"
      - ".github/workflows/flasher.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'tools/requirements-ci.txt') }}
      - name: Install PlatformIO (exact versions, hash-checked)
        run: pip install --require-hashes -r tools/requirements-ci.txt

      # Placeholder secrets on purpose: prebuilt images must not carry anyone's WiFi or
      # passwords. The firmware ignores the placeholder passwords, so the admin password
      # is chosen in the setup portal.
      - name: Placeholder secrets
        run: cp src/secrets.example.h src/secrets.h

      - name: Build bundled blocklist
        run: python3 tools/build_blocklist.py data/blocklist.bin

      - name: Build firmware + LittleFS image
        run: |
          pio run -e c3
          pio run -e c3 -t buildfs
          pio run -e s3
          pio run -e s3 -t buildfs

      - name: Assemble site
        run: |
          set -euo pipefail
          out=site; b=.pio/build/c3
          mkdir -p "$out"
          cp docs/index.html "$out/"
          # ESP Web Tools, pinned and hash-checked (npm's published integrity for this
          # version). To upgrade: bump the version and paste the new
          # `npm view esp-web-tools@<v> dist.integrity` value.
          ewt_ver=10.4.0
          ewt_sri=sha512-3pwkeFFm5Fj7UQo8SJNYK5RXrtNCpq6X9QoI6bMT4GBZWgrJqjn0YvM9ihG74BtMoSFYXfmDtkehuxe50PTMPQ==
          curl -fsSL -o ewt.tgz "https://registry.npmjs.org/esp-web-tools/-/esp-web-tools-$ewt_ver.tgz"
          test "sha512-$(openssl dgst -sha512 -binary ewt.tgz | base64 -w0)" = "$ewt_sri" \
            || { echo "esp-web-tools $ewt_ver tarball does not match its pinned hash"; exit 1; }
          mkdir ewt && tar xzf ewt.tgz -C ewt
          cp -r ewt/package/dist/web "$out/esp-web-tools"
          cp "$b/bootloader.bin" "$b/partitions.bin" "$b/firmware.bin" "$b/littlefs.bin" "$out/"
          s3=.pio/build/s3; mkdir -p "$out/s3"
          cp "$s3/bootloader.bin" "$s3/partitions.bin" "$s3/firmware.bin" "$s3/littlefs.bin" "$out/s3/"
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin "$out/"
          version="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          jq --arg v "$version" '.version = $v' docs/manifest.json > "$out/manifest.json"
          ls -l "$out"

      - name: Sanity checks
        run: |
          set -euo pipefail
          # Guard against ever shipping an unauthenticated build again.
          for fw in site/firmware.bin site/s3/firmware.bin; do
            for s in "missing CSRF header" "bad Host header" "no admin password set" "too many wrong passwords" "press the BOOT button"; do
              grep -q "$s" "$fw" || { echo "$fw lacks '$s'"; exit 1; }
            done
          done
          # Manifest offsets must match each build's partition table.
          off() { echo $(( $(awk -F, -v n="$2" '$1 ~ "^"n" *$" {gsub(/ /,"",$4); print $4}' "$1") )); }
          part() { jq --arg c "$1" --arg p "$2" '.builds[] | select(.chipFamily==$c) | .parts[] | select(.path==$p).offset' site/manifest.json; }
          test "$(part ESP32-C3 firmware.bin)" -eq "$(off partitions.csv app0)"
          test "$(part ESP32-C3 littlefs.bin)" -eq "$(off partitions.csv spiffs)"
          test "$(part ESP32-S3 s3/firmware.bin)" -eq "$(off partitions-s3-8mb.csv app0)"
          test "$(part ESP32-S3 s3/littlefs.bin)" -eq "$(off partitions-s3-8mb.csv spiffs)"
          # Every file the manifest names must be in the site.
          for f in $(jq -r '.builds[].parts[].path' site/manifest.json); do test -f "site/$f" || { echo "missing site/$f"; exit 1; }; done
          # The page must load the self-hosted installer, never a CDN copy.
          test -f site/esp-web-tools/install-button.js
          if grep -qE '<script[^>]+src="https?://' site/index.html; then echo "index.html loads a remote script"; exit 1; fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
